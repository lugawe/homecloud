apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: argocd
  name: argocd-init
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["argocd-secrets"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["argocd-cm"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: argocd
  name: argocd-init
subjects:
  - kind: ServiceAccount
    namespace: argocd
    name: argocd-server
roleRef:
  kind: Role
  name: argocd-init
  apiGroup: rbac.authorization.k8s.io
