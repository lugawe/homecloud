apiVersion: v1

kind: ConfigMap

metadata:
  namespace: storage
  name: garage-data-configmap

data:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    db_engine = "lmdb"
    replication_factor = 1
    rpc_bind_addr = "[::]:3901"
    rpc_public_addr = "garage-data.storage.svc.cluster.local:3901"

    [s3_api]
    s3_region = "eu-central-1"
    api_bind_addr = "[::]:3900"

    [admin]
    api_bind_addr = "[::]:3903"
