apiVersion: v1

kind: Service

metadata:
  namespace: storage
  name: garage-longhorn
  labels:
    app: garage-longhorn

spec:
  selector:
    app: garage-longhorn
  type: ClusterIP
  ports:
    - name: s3
      port: 3900
      targetPort: 3900
    - name: rpc
      port: 3901
      targetPort: 3901
