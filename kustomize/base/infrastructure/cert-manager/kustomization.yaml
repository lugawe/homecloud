apiVersion: kustomize.config.k8s.io/v1beta1

kind: Kustomization

namespace: cert-manager

resources:
  - namespace.yaml

helmCharts:
  - namespace: cert-manager
    releaseName: cert-manager
    repo: https://charts.jetstack.io
    name: cert-manager
    version: v1.20.2
    includeCRDs: true
    valuesInline:
      crds:
        enabled: true
