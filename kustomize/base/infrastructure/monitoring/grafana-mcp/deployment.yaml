apiVersion: apps/v1

kind: Deployment

metadata:
  namespace: monitoring
  name: grafana-mcp
  labels:
    app: grafana-mcp

spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana-mcp
  template:
    metadata:
      labels:
        app: grafana-mcp
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana-mcp
          image: grafana/mcp-grafana:0.14.0
          args:
            [
              "--address",
              "0.0.0.0:8000",
              "--transport",
              "streamable-http",
              "--metrics",
            ]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: GRAFANA_URL
              value: "http://grafana.monitoring.svc.cluster.local:80"
            - name: GRAFANA_ORG_ID
              value: "1"
            - name: GRAFANA_SERVICE_ACCOUNT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: monitoring-secrets
                  key: GRAFANA_SERVICE_ACCOUNT_TOKEN
