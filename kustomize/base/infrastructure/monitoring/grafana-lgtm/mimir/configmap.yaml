apiVersion: v1

kind: ConfigMap

metadata:
  namespace: monitoring
  name: mimir-configmap

data:
  mimir.yaml: |
    target: all

    multitenancy_enabled: false

    server:
      http_listen_port: 8080

    activity_tracker:
      filepath: /data/metrics-activity.log

    common:
      storage:
        backend: filesystem
        filesystem:
          dir: /data/mimir

    blocks_storage:
      filesystem:
        dir: /data/mimir/blocks
      tsdb:
        dir: /data/mimir/tsdb

    compactor:
      data_dir: /data/mimir/compactor

    limits:
      compactor_blocks_retention_period: 336h

    ingester:
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory
        replication_factor: 1

    store_gateway:
      sharding_ring:
        replication_factor: 1

    ruler_storage:
      backend: filesystem
      filesystem:
        dir: /data/mimir/rules
