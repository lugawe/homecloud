apiVersion: v1

kind: ConfigMap

metadata:
  namespace: monitoring
  name: alloy-configmap

data:
  logs.alloy: |
    discovery.kubernetes "pods" {
      role = "pod"
    }

    discovery.relabel "pods" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        target_label  = "node"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label  = "app"
      }

      rule {
        source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_label_app"]
        separator     = "/"
        target_label  = "job"
      }
    }

    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.pods.output
      forward_to = [loki.write.loki.receiver]
    }

    loki.write "loki" {
      endpoint {
        url = "http://grafana.monitoring.svc.cluster.local:3100/loki/api/v1/push"
      }
    }

  metrics.alloy: |
    prometheus.remote_write "default" {
      endpoint {
        url = "http://grafana.monitoring.svc.cluster.local:9090/api/v1/write"
      }
    }

  metrics-node-exporter.alloy: |
    prometheus.scrape "node_exporter" {
      targets = [{
        __address__ = "node-exporter.monitoring.svc.cluster.local:9100",
        job         = "node-exporter",
      }]
      forward_to = [prometheus.remote_write.default.receiver]
    }

  metrics-vault.alloy: |
    prometheus.scrape "vault" {
      targets = [{
        __address__ = "vault.secrets-system.svc.cluster.local:8200",
        job         = "vault",
      }]
      metrics_path = "/v1/sys/metrics"
      params       = { format = ["prometheus"] }
      scheme       = "https"
      tls_config {
        insecure_skip_verify = true
      }
      forward_to = [prometheus.remote_write.default.receiver]
    }

  metrics-vso.alloy: |
    prometheus.scrape "vso" {
      targets = [{
        __address__ = "vault-secrets-operator-metrics-service.secrets-system.svc.cluster.local:8443",
        job         = "vault-secrets-operator",
      }]
      scheme = "https"
      tls_config {
        insecure_skip_verify = true
      }
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      forward_to = [prometheus.remote_write.default.receiver]
    }

  metrics-keycloak.alloy: |
    prometheus.scrape "keycloak" {
      targets = [{
        __address__ = "keycloak.keycloak.svc.cluster.local:9000",
        job         = "keycloak",
      }]
      metrics_path = "/metrics"
      forward_to   = [prometheus.remote_write.default.receiver]
    }

  metrics-grafana-mcp.alloy: |
    prometheus.scrape "grafana_mcp" {
      targets = [{
        __address__ = "grafana-mcp.monitoring.svc.cluster.local:8000",
        job         = "grafana-mcp",
      }]
      metrics_path = "/metrics"
      forward_to = [prometheus.remote_write.default.receiver]
    }

  otel.alloy: |
    otelcol.receiver.otlp "default" {
      grpc {
        endpoint = "0.0.0.0:4317"
      }

      output {
        metrics = [otelcol.exporter.otlp_grpc.grafana.input]
        logs    = [otelcol.exporter.otlp_grpc.grafana.input]
        traces  = [otelcol.exporter.otlp_grpc.grafana.input]
      }
    }

    otelcol.exporter.otlp_grpc "grafana" {
      client {
        endpoint = "grafana.monitoring.svc.cluster.local:4317"
        tls {
          insecure = true
        }
      }
    }
