apiVersion: v1

kind: ConfigMap

metadata:
  namespace: secrets-system
  name: vault-config
  labels:
    app: vault

data:
  vault.hcl: |
    listener "tcp" {
      address       = "0.0.0.0:8200"
      tls_cert_file = "/vault/tls/tls.crt"
      tls_key_file  = "/vault/tls/tls.key"
    }

    storage "file" {
      path = "/vault/data"
    }

    disable_mlock = true

    ui = false
