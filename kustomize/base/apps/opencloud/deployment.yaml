apiVersion: apps/v1

kind: Deployment

metadata:
  namespace: opencloud
  name: opencloud-app
  labels:
    app: opencloud-app

spec:
  replicas: 1
  selector:
    matchLabels:
      app: opencloud-app
  template:
    metadata:
      labels:
        app: opencloud-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: opencloud-app
          image: opencloudeu/opencloud-rolling:7.2.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command: [ "/bin/sh" ]
          args: [ "-c", "opencloud init || true; opencloud server" ]
          env:
            - name: OC_INSECURE
              value: "true"
            - name: OC_URL
              valueFrom:
                secretKeyRef:
                  name: opencloud-secrets
                  key: OC_URL
            - name: OC_OIDC_ISSUER
              valueFrom:
                secretKeyRef:
                  name: opencloud-secrets
                  key: OC_OIDC_ISSUER
            - name: WEB_OIDC_AUTHORITY
              valueFrom:
                secretKeyRef:
                  name: opencloud-secrets
                  key: WEB_OIDC_AUTHORITY
            - name: WEB_OIDC_CLIENT_ID
              value: opencloud
            - name: PROXY_AUTOPROVISION_ACCOUNTS
              value: "true"
          volumeMounts:
            - name: opencloud-app-storage
              mountPath: /etc/opencloud
              subPath: config
            - name: opencloud-app-storage
              mountPath: /var/lib/opencloud
              subPath: data
      volumes:
        - name: opencloud-app-storage
          persistentVolumeClaim:
            claimName: opencloud-app-pvc
