apiVersion: apps/v1

kind: Deployment

metadata:
  namespace: vaultwarden
  name: vaultwarden-app
  labels:
    app: vaultwarden-app

spec:
  replicas: 1
  selector:
    matchLabels:
      app: vaultwarden-app
  template:
    metadata:
      labels:
        app: vaultwarden-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vaultwarden-app
          image: vaultwarden/server:1.36.0-alpine
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            # --- Server ---
            - name: DOMAIN
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-secrets
                  key: DOMAIN
            - name: SIGNUPS_ALLOWED
              value: "false"
            # --- SSO ---
            - name: SSO_ENABLED
              value: "true"
            - name: SSO_ONLY
              value: "true"
            - name: SSO_AUTHORITY
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-secrets
                  key: SSO_AUTHORITY
            - name: SSO_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-secrets
                  key: SSO_CLIENT_ID
            - name: SSO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-secrets
                  key: SSO_CLIENT_SECRET
          volumeMounts:
            - name: vaultwarden-app-storage
              mountPath: /data
              subPath: data
      volumes:
        - name: vaultwarden-app-storage
          persistentVolumeClaim:
            claimName: vaultwarden-app-pvc
