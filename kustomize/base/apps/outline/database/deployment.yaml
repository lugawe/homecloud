apiVersion: apps/v1

kind: Deployment

metadata:
  namespace: outline
  name: outline-database
  labels:
    app: outline-database

spec:
  replicas: 1
  selector:
    matchLabels:
      app: outline-database
  template:
    metadata:
      labels:
        app: outline-database
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: outline-database
          image: postgres:18-alpine
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: POSTGRES_DB
              value: "outline"
            - name: POSTGRES_USER
              value: "outline"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: outline-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: outline-database-storage
              mountPath: /var/lib/postgresql
      volumes:
        - name: outline-database-storage
          persistentVolumeClaim:
            claimName: outline-database-pvc
